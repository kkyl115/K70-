# VAS profile: efficiency (续航优先)
# 目标: 降低无效唤醒与迁移成本，不牺牲前台响应到"卡"的程度。

# --- 频率下限（保持最低，减少常驻高频）---
/sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq|307200|小核最低
/sys/devices/system/cpu/cpufreq/policy3/scaling_min_freq|499200|中核最低
/sys/devices/system/cpu/cpufreq/policy7/scaling_min_freq|595200|大核最低

# --- 迁移与唤醒（TBD：以 /proc/schedstat 迁移次数与 wakeup 次数标定）---
# /proc/sys/kernel/sched_migration_cost_ns|TBD|上调，减少跨簇迁移
# /proc/sys/kernel/sched_wakeup_granularity_ns|TBD|上调，减少过度抢占

# --- 禁止项 ---
# scaling_max_freq : 禁止（压低上限看似省电，实际会让任务在低频长跑，功耗反而上升）
# thermal          : 禁止
