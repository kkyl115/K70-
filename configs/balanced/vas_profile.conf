# VAS profile: balanced (日常均衡)
# 格式: 路径|目标值|说明
# 单位: 频率 kHz, 时间 ns/us
# 注意: 默认值一律留空由 vas_apply.sh 采集原值再定；此处只放低风险项。
# 标记 TBD 的必须先用 A/B 数据标定，禁止直接上线。

# --- 频率下限（提升交互响应，代价是待机功耗）---
/sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq|307200|小核保持最低，日常不强抬
/sys/devices/system/cpu/cpufreq/policy3/scaling_min_freq|499200|中核最低，靠 WALT 自然抬升
/sys/devices/system/cpu/cpufreq/policy7/scaling_min_freq|595200|大核最低，绝不常驻高频

# --- 调度粒度（TBD：先采集原厂值，改动需 5 轮 A/B）---
# /proc/sys/kernel/sched_migration_cost_ns|TBD|迁移成本，防抖动
# /proc/sys/kernel/sched_wakeup_granularity_ns|TBD|唤醒抢占粒度
# /proc/sys/kernel/sched_min_granularity_ns|TBD|最小调度粒度

# --- 永不写入的项（显式记录，防止后人误加）---
# scaling_max_freq        : 禁止（等于关 DVFS/绕温控）
# scaling_governor        : 禁止（原厂 walt，换 schedutil 会劣化）
# thermal zone / cooling  : 禁止
