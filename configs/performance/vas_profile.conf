# VAS profile: performance (帧稳定 / 前台响应优先，不绕温控)
# 硬规则: 绝不写 scaling_max_freq，绝不改 thermal，绝不换 governor。

# --- 频率下限（只抬下限，不锁上限）---
/sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq|576000|小核适度抬升，保证轻线程不被拖慢
/sys/devices/system/cpu/cpufreq/policy3/scaling_min_freq|1017600|中核抬下限，缩短渲染线程唤醒延迟
/sys/devices/system/cpu/cpufreq/policy7/scaling_min_freq|864000|大核抬下限，但不锁 3187200

# --- 调度粒度（TBD：必须用 gfxinfo/atrace 的 p95 帧时标定）---
# /proc/sys/kernel/sched_wakeup_granularity_ns|TBD|下调以加快抢占
# /proc/sys/kernel/sched_migration_cost_ns|TBD|下调让负载更快上大核

# --- 禁止项 ---
# scaling_max_freq  : 禁止写入（会同时架空 DVFS 与温控）
# cooling_device    : 禁止
# thermal_zone      : 禁止
